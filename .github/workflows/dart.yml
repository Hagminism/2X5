name: PR Build Check for Android

on:
  pull_request:
    branches:
      - develop

jobs:
  build_android:
    name: Flutter Android Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for unauthorized sensitive files
        run: |
          # 시뮬레이션용 파일이 아닌, 실제 커밋된 파일 중에 .env나 local.properties가 있는지 검사
          # CI에서 방금 생성한 파일들은 무시하고, 팀원이 push한 파일만 검사
          FOUND_FILES=$(git ls-files | grep -E '\.env$|local\.properties$|google-services\.json$|GoogleService-Info\.plist$|firebase_options\.dart$')
          
          if [ -n "$FOUND_FILES" ]; then
            echo "보안 경고: 민감한 파일이 커밋에 포함되어 푸시되었습니다."
            echo "발견된 파일들:"
            echo "$FOUND_FILES"
            echo ""
            echo "위 파일들은 GitHub Secrets를 통해 관리되어야 하며, 레포지토리에 직접 올리면 안 됩니다."
            echo ".gitignore에 등록되어 있는지 확인하고 'git rm --cached'로 삭제 후 다시 푸시하세요."
            exit 1
          else
            echo "통과: 커밋된 민감 파일이 없습니다."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Cache build_runner
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.dart_tool/build
          key: ${{ runner.os }}-build_runner-${{ hashFiles('**/*.dart', '**/*.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build_runner-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # firebase_options.dart 복원
      - name: Restore firebase_options.dart
        run: |
          mkdir -p lib
          echo "${{ secrets.FIREBASE_OPTIONS_DART_B64 }}" | base64 --decode > lib/firebase_options.dart

      # Android Firebase 설정 파일 복원
      - name: Restore android google-services.json
        run: |
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 --decode > android/app/google-services.json

      # iOS Firebase 설정 파일 복원 (iOS job에서도 다시 생성하지만, 공통 복원 유지 가능)
      - name: Restore iOS GoogleService-Info.plist
        run: |
          mkdir -p ios/Runner
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}" | base64 --decode > ios/Runner/GoogleService-Info.plist

      # pubspec.yaml asset 대응
      - name: Create .env
        run: |
          cat > .env << 'EOF'
          NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}
          REDIRECT_URI=${{ secrets.NAVER_REDIRECT_URI }}
          EOF

      - name: Setup Android local.properties
        run: |
          echo "naverClientId=${{ secrets.NAVER_CLIENT_ID }}" >> android/local.properties
          echo "naverClientSecret=${{ secrets.NAVER_CLIENT_SECRET }}" >> android/local.properties
          echo "redirectUri=${{ secrets.NAVER_REDIRECT_URI }}" >> android/local.properties
          echo "kakaoNativeAppKey=${{ secrets.KAKAO_NATIVE_APP_KEY }}" >> android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Android release APK
        run: flutter build apk --release --dart-define=KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}