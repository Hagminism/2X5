name: PR Build Check for Android, iOS

on:
  pull_request:
    branches:
      - develop

jobs:
  build_android:
    name: Flutter Android Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Cache build_runner
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.dart_tool/build
          key: ${{ runner.os }}-build_runner-${{ hashFiles('**/*.dart', '**/*.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build_runner-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # firebase_options.dart 복원
      - name: Restore firebase_options.dart
        run: |
          mkdir -p lib
          echo "${{ secrets.FIREBASE_OPTIONS_DART_B64 }}" | base64 --decode > lib/firebase_options.dart

      # Android Firebase 설정 파일 복원
      - name: Restore android google-services.json
        run: |
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 --decode > android/app/google-services.json

      # iOS Firebase 설정 파일 복원 (iOS job에서도 다시 생성하지만, 공통 복원 유지 가능)
      - name: Restore iOS GoogleService-Info.plist
        run: |
          mkdir -p ios/Runner
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}" | base64 --decode > ios/Runner/GoogleService-Info.plist

      # pubspec.yaml asset 대응
      - name: Create .env
        run: |
          cat > .env << 'EOF'
          NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}
          REDIRECT_URI=${{ secrets.NAVER_REDIRECT_URI }}
          EOF

      - name: Setup Android local.properties
        run: |
          echo "naverClientId=${{ secrets.NAVER_CLIENT_ID }}" >> android/local.properties
          echo "naverClientSecret=${{ secrets.NAVER_CLIENT_SECRET }}" >> android/local.properties
          echo "redirectUri=${{ secrets.NAVER_REDIRECT_URI }}" >> android/local.properties
          echo "kakaoNativeAppKey=${{ secrets.KAKAO_NATIVE_APP_KEY }}" >> android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Android release APK
        run: flutter build apk --release --dart-define=KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}

  build_ios:
    name: Flutter iOS Build Check
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Cache build_runner
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.dart_tool/build
          key: ${{ runner.os }}-build_runner-${{ hashFiles('**/*.dart', '**/*.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build_runner-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # firebase_options.dart 복원
      - name: Restore firebase_options.dart
        run: |
          mkdir -p lib
          echo "${{ secrets.FIREBASE_OPTIONS_DART_B64 }}" | base64 --decode > lib/firebase_options.dart

      # Android 파일도 공통 복원 (필수는 아니지만 파일 셋 동기화 목적)
      - name: Restore android google-services.json
        run: |
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 --decode > android/app/google-services.json

      # iOS Firebase 설정 파일 복원
      - name: Restore iOS GoogleService-Info.plist
        run: |
          mkdir -p ios/Runner
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}" | base64 --decode > ios/Runner/GoogleService-Info.plist

      # pubspec.yaml asset 대응
      - name: Create .env
        run: |
          cat > .env << 'EOF'
          NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}
          REDIRECT_URI=${{ secrets.NAVER_REDIRECT_URI }}
          EOF

      # iOS base configuration 파일 생성
      - name: Create iOS Secrets.xcconfig
        run: |
          cat > ios/Runner/Secrets.xcconfig << 'EOF'
          GOOGLE_REVERSE_CLIENT_ID=${{ secrets.GOOGLE_REVERSE_CLIENT_ID }}
          KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}
          URL_SCHEME=team2x5
          NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}
          SERVICE_APP_NAME=team2x5
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build iOS release IPA (no codesign)
        run: flutter build ipa --release --no-codesign --dart-define=KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}